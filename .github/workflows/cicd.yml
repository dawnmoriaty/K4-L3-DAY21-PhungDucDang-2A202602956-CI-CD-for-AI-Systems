name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'data/*.dvc'
      - '**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: "https://dagshub.com/dawnmoriaty/K4-L3-DAY21-PhungDucDang-2A202602956-CI-CD-for-AI-Systems.mlflow"
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model and report to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3
          s3 = boto3.client("s3")
          bucket = os.environ["ARTIFACT_BUCKET"]
          try:
              s3.copy_object(
                  Bucket=bucket,
                  CopySource={'Bucket': bucket, 'Key': 'artifacts/current/report.json'},
                  Key='artifacts/current/prev_report.json'
              )
          except Exception:
              pass
          s3.upload_file("models/model.joblib", bucket, "artifacts/current/model.joblib")
          s3.upload_file("outputs/report.json", bucket, "artifacts/current/report.json")
          print("Uploaded model.joblib and report.json successfully")
          PYEOF

      - name: Save reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65) va Rollback Gate (Bonus 4).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate and rollback gate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import json
          import boto3
          from botocore.exceptions import ClientError

          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED Quality Gate: f1_score {f1:.4f} >= 0.65.")

          # Bonus 4: Rollback Gate - Kiem tra F1 model moi >= F1 model cu tren S3
          s3 = boto3.client("s3")
          bucket = os.environ.get("ARTIFACT_BUCKET")
          try:
              s3.download_file(bucket, "artifacts/current/prev_report.json", "/tmp/prev_report.json")
              with open("/tmp/prev_report.json") as f:
                  prev = json.load(f)
              prev_f1 = float(prev.get("f1_score", 0.0))
              print(f"Rollback Gate Check: F1 moi ({f1:.4f}) vs F1 cu ({prev_f1:.4f})")
              if f1 < prev_f1:
                  raise SystemExit(f"FAILED (Rollback Gate): F1 moi ({f1:.4f}) < F1 cu ({prev_f1:.4f}). Huy release.")
              print("Rollback Gate PASSED: F1 moi >= F1 cu. Du dieu kien release.")
          except ClientError as e:
              print(f"Rollback Gate Notice: Khong tim thay ban cu tren S3 ({e}). Du dieu kien release.")
          except Exception as e:
              print(f"Rollback Gate Notice: {e}. Du dieu kien release.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
